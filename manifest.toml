packaging_format = 2

id = "mattermost"
name = "Mattermost"
description.en = "Collaboration platform built for developers"
description.fr = "Plateforme de collaboration conçue pour les développeurs"

version = "11.11.0~ynh1"

maintainers = ["pmorinerie"]

[upstream]
license = "GPL-3.0-only"
website = "http://www.mattermost.org/"
admindoc = "https://docs.mattermost.com/guides/deployment.html"
userdoc = "https://docs.mattermost.com/guides/messaging.html"
code = "https://github.com/mattermost/mattermost-server"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "750M"
ram.build = "350M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mattermost"

    [install.init_main_permission]
    help.en = "If visitors selected, Mattermost will be accessible by users without a YunoHost account. This can be changed later via the webadmin."
    help.fr = "Si « Visiteurs » est sélectionné, Mattermost sera accessible même par les utilisateurs n’ayant pas de compte YunoHost. Vous pourrez changer ce réglage plus tard dans l’interface d’administration."
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.version]
    ask.en = "Choose the version you want to install"
    ask.fr = "Choisissez la version que vous souhaitez installer"
    help.en = "Use Team Edition for the open source version (ARM, ARM64 and x86-64 support) or Enterprise Edition if you want to use a license (x86-64 and ARM64 support). Mostlymatter is a fork of Mattermost Team Edition that removes the limitations on users and messages count."
    help.fr = "Utilisez Team Edition pour la version open-source (prise en charge ARM, ARM64 et x86-64) ou Édition Enterprise si vous souhaitez utiliser une licence (prise en charge x86-64 et ARM64). Mostlymatter est un fork de Mattermost qui retire les limitations du nombre d'utilisateurs et de messages."
    type = "select"
    choices = ["Enterprise", "Team", "Mostlymatter"]
    default = "Team"

    [install.language]
    ask.en = "Choose the language of the chat for the admin"
    ask.fr = "Choissisez la langue utilisée par le compte administrateur"
    type = "select"
    choices = ["de", "en", "es", "fr", "it", "pt"]
    default = "fr"

    [install.team_display_name]
    ask.en = "Choose a Team name"
    ask.fr = "Choisissez le nom de l’équipe"
    type = "string"
    example = "Team"
    default = "Team"

[resources]
    [resources.sources]

        [resources.sources.team]
        amd64.url = "https://releases.mattermost.com/11.11.0/mattermost-team-11.11.0-linux-amd64.tar.gz"
        amd64.sha256 = "fd7faeb4ed70d1da0e0ad961d1dbb2ffda81801714058cad2cb3e00a529c8a1d"
        arm64.url = "https://releases.mattermost.com/11.11.0/mattermost-team-11.11.0-linux-arm64.tar.gz"
        arm64.sha256 = "3c34796cdd1f2e8fb85ef25a70482bc08b3c8b5b57d6180211765e1eda2d84a1"
        armhf.url = "https://github.com/remiheens/mattermost-docker-arm/releases/download/v11.10.0/mattermost-v11.10.0-linux-arm.tar.gz"
        armhf.sha256 = "a9739e951a471494ee993b127e22e2cde54db15dd6dd4b2b68628ae944db129e"

        [resources.sources.enterprise]
        amd64.url = "https://releases.mattermost.com/11.11.0/mattermost-enterprise-11.11.0-linux-amd64.tar.gz"
        amd64.sha256 = "03dfa47063849fe9e799c9523c56c74ec19852948e6fc42d9fc3e10cc5d95bc9"
        arm64.url = "https://releases.mattermost.com/11.11.0/mattermost-enterprise-11.11.0-linux-arm64.tar.gz"
        arm64.sha256 = "0c94559688899555a7e01773b446f9c98123e66f0965f8acafc4678a0123a2cf"

        [resources.sources.mostlymatter]
        in_subdir = false
        extract = false
        rename = "mostlymatter"
        amd64.url = "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-amd64-v11.11.0"
        amd64.sha256 = "1b8f73e3864122a6c24b7e9d687db54b0de21e6e1ba7012d4544b87bec151709"
        arm64.url = "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-arm64-v11.11.0"
        arm64.sha256 = "ff8adaebebb7a09fe737e8efe59259fc657d8b2a91b18501d6f1af1e0715df87"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    
    [resources.ports]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"

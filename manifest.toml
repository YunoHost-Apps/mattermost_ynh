packaging_format = 2

id = "mattermost"
name = "Mattermost"
description.en = "Collaboration platform built for developers"
description.fr = "Plateforme de collaboration conçue pour les développeurs"

version = "12.0.1~ynh1"

maintainers = ["pmorinerie"]

[upstream]
license = "GPL-3.0-only"
website = "http://www.mattermost.org/"
admindoc = "https://docs.mattermost.com/guides/deployment.html"
userdoc = "https://docs.mattermost.com/guides/messaging.html"
code = "https://github.com/mattermost/mattermost-server"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "750M"
ram.build = "350M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mattermost"

    [install.init_main_permission]
    help.en = "If visitors selected, Mattermost will be accessible by users without a YunoHost account. This can be changed later via the webadmin."
    help.fr = "Si « Visiteurs » est sélectionné, Mattermost sera accessible même par les utilisateurs n’ayant pas de compte YunoHost. Vous pourrez changer ce réglage plus tard dans l’interface d’administration."
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.version]
    ask.en = "Choose the version you want to install"
    ask.fr = "Choisissez la version que vous souhaitez installer"
    help.en = "Use Team Edition for the open source version (ARM, ARM64 and x86-64 support) or Enterprise Edition if you want to use a license (x86-64 and ARM64 support). Mostlymatter is a fork of Mattermost Team Edition that removes the limitations on users and messages count."
    help.fr = "Utilisez Team Edition pour la version open-source (prise en charge ARM, ARM64 et x86-64) ou Édition Enterprise si vous souhaitez utiliser une licence (prise en charge x86-64 et ARM64). Mostlymatter est un fork de Mattermost qui retire les limitations du nombre d'utilisateurs et de messages."
    type = "select"
    choices = ["Enterprise", "Team", "Mostlymatter"]
    default = "Team"

    [install.language]
    ask.en = "Choose the language of the chat for the admin"
    ask.fr = "Choissisez la langue utilisée par le compte administrateur"
    type = "select"
    choices = ["de", "en", "es", "fr", "it", "pt"]
    default = "fr"

    [install.team_display_name]
    ask.en = "Choose a Team name"
    ask.fr = "Choisissez le nom de l’équipe"
    type = "string"
    example = "Team"
    default = "Team"

[resources]
    [resources.sources]

        [resources.sources.team]
        amd64.url = "https://releases.mattermost.com/12.0.1/mattermost-team-12.0.1-linux-amd64.tar.gz"
        amd64.sha256 = "1e7512f4782d4df552543f60ca17cc572a9ddc8faaebc3942dcc40b4f6a979d9"
        arm64.url = "https://releases.mattermost.com/12.0.1/mattermost-team-12.0.1-linux-arm64.tar.gz"
        arm64.sha256 = "6246ebcba8418606ac98e1e9ee5b0cd732e75190bb0c67c4d66a5503007aecf8"
        armhf.url = "https://github.com/remiheens/mattermost-docker-arm/releases/download/v12.0.0/mattermost-v12.0.0-linux-arm.tar.gz"
        armhf.sha256 = "5ea25a25ecc5f1f8682a848d1d5e5b13be3de8c3b7dfe3598104a805ba8162f1"

        [resources.sources.enterprise]
        amd64.url = "https://releases.mattermost.com/12.0.1/mattermost-enterprise-12.0.1-linux-amd64.tar.gz"
        amd64.sha256 = "f74b26f3a245b336b5dc7978a71ac7cd17ba22601de2c68b223dd0114cb2676c"
        arm64.url = "https://releases.mattermost.com/12.0.1/mattermost-enterprise-12.0.1-linux-arm64.tar.gz"
        arm64.sha256 = "ba24c46927e67fb789d712be95c76045c9a8e0a3dfde472306b902b12f3efce7"

        [resources.sources.mostlymatter]
        in_subdir = false
        extract = false
        rename = "mostlymatter"
        amd64.url = "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-amd64-v12.0.1"
        amd64.sha256 = "6f332edcd1904aebf1119b8b1de0d3ef37fedaf331dbb9a1e0e64879d64655b3"
        arm64.url = "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-arm64-v12.0.1"
        arm64.sha256 = "fcfd9724f677e92296ab1331f8511e12d916c4f4662a173673b9d35371ae7070"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    
    [resources.ports]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"

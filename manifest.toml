packaging_format = 2

id = "mattermost"
name = "Mattermost"
description.en = "Collaboration platform built for developers"
description.fr = "Plateforme de collaboration conçue pour les développeurs"

version = "11.11.1~ynh1"

maintainers = ["pmorinerie"]

[upstream]
license = "GPL-3.0-only"
website = "http://www.mattermost.org/"
admindoc = "https://docs.mattermost.com/guides/deployment.html"
userdoc = "https://docs.mattermost.com/guides/messaging.html"
code = "https://github.com/mattermost/mattermost-server"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "armhf", "arm64"]
multi_instance = true

ldap = false
sso = false

disk = "750M"
ram.build = "350M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mattermost"

    [install.init_main_permission]
    help.en = "If visitors selected, Mattermost will be accessible by users without a YunoHost account. This can be changed later via the webadmin."
    help.fr = "Si « Visiteurs » est sélectionné, Mattermost sera accessible même par les utilisateurs n’ayant pas de compte YunoHost. Vous pourrez changer ce réglage plus tard dans l’interface d’administration."
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

    [install.version]
    ask.en = "Choose the version you want to install"
    ask.fr = "Choisissez la version que vous souhaitez installer"
    help.en = "Use Team Edition for the open source version (ARM, ARM64 and x86-64 support) or Enterprise Edition if you want to use a license (x86-64 and ARM64 support). Mostlymatter is a fork of Mattermost Team Edition that removes the limitations on users and messages count."
    help.fr = "Utilisez Team Edition pour la version open-source (prise en charge ARM, ARM64 et x86-64) ou Édition Enterprise si vous souhaitez utiliser une licence (prise en charge x86-64 et ARM64). Mostlymatter est un fork de Mattermost qui retire les limitations du nombre d'utilisateurs et de messages."
    type = "select"
    choices = ["Enterprise", "Team", "Mostlymatter"]
    default = "Team"

    [install.language]
    ask.en = "Choose the language of the chat for the admin"
    ask.fr = "Choissisez la langue utilisée par le compte administrateur"
    type = "select"
    choices = ["de", "en", "es", "fr", "it", "pt"]
    default = "fr"

    [install.team_display_name]
    ask.en = "Choose a Team name"
    ask.fr = "Choisissez le nom de l’équipe"
    type = "string"
    example = "Team"
    default = "Team"

[resources]
    [resources.sources]

        [resources.sources.team]
        amd64.url = "https://releases.mattermost.com/11.11.1/mattermost-team-11.11.1-linux-amd64.tar.gz"
        amd64.sha256 = "c9237b0b54dce805a63e053c0a0516511bc8a2e47e9a06dd11050c2a0d79f616"
        arm64.url = "https://releases.mattermost.com/11.11.1/mattermost-team-11.11.1-linux-arm64.tar.gz"
        arm64.sha256 = "e3228c8cc6b5aedce835f68ae21ac5626473850aaf4d63003094de4b1350166b"
        armhf.url = "https://github.com/remiheens/mattermost-docker-arm/releases/download/v11.11.0/mattermost-v11.11.0-linux-arm.tar.gz"
        armhf.sha256 = "b26a23b7753644f380e83f11e27645e4d2b4ac5b5f0ff811186a516dc7cd379c"

        [resources.sources.enterprise]
        amd64.url = "https://releases.mattermost.com/11.11.1/mattermost-enterprise-11.11.1-linux-amd64.tar.gz"
        amd64.sha256 = "f1eaaaa4848dbf96fa839cf8dd80fbbe825e241744a4dc839317895511bc84ae"
        arm64.url = "https://releases.mattermost.com/11.11.1/mattermost-enterprise-11.11.1-linux-arm64.tar.gz"
        arm64.sha256 = "bd3a138cda2e3d6894e326dbc86a45072847c87063d5ae73eef7d5701c89b4be"

        [resources.sources.mostlymatter]
        in_subdir = false
        extract = false
        rename = "mostlymatter"
        amd64.url = "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-amd64-v11.11.1"
        amd64.sha256 = "70417e24db13212cae9382c3374eef46317da6d2058004f791bd37fb086d4f0e"
        arm64.url = "https://packages.framasoft.org/projects/mostlymatter/mostlymatter-arm64-v11.11.1"
        arm64.sha256 = "4b87d7c55d551508f832f57b0880b84af2b1584ed5c6448598305c484e78381e"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]
    
    [resources.ports]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
